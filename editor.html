<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Factory Editor</title>
    <style>
      :root {
        --bg: #0b0d12; --panel: #12151d; --line: #232838; --text: #d7dbe4; --dim: #8a92a6;
        --accent: #7aa2ff; --danger: #ff5c6c; --ok: #6be38f; --warn: #ffcc4d;
        font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; color: var(--text);
      }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      body { display: grid; grid-template: 44px 1fr / 168px 1fr 300px; }
      button, select, input { font: inherit; color: inherit; }
      button {
        background: #1c2130; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
      button.danger { color: var(--danger); }
      button.on { border-color: var(--accent); color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; }

      #top { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
      #top .file { margin-right: 10px; font-weight: 600; min-width: 140px; }
      #top .file small { color: var(--dim); font-weight: 400; }
      #top .gap { flex: 1; }
      #top .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

      #left { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 10px; }
      #left h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
      #left h3:first-child { margin-top: 0; }
      .part {
        display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px;
        border: 1px solid var(--line); background: #171b26; cursor: grab; user-select: none;
      }
      .part:hover { border-color: var(--accent); }
      .part svg { width: 22px; height: 22px; flex: none; }
      #history { font-size: 12px; color: var(--dim); }
      #history div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #history b { font-weight: 600; color: var(--warn); }

      #center { position: relative; overflow: hidden; }
      #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #0b0d12; }
      body.playing #play { display: block; }
      #problems {
        position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); max-height: 30%; overflow-y: auto;
        padding: 8px 10px; border-radius: 8px; background: rgba(10, 12, 18, .88); font-size: 12px; white-space: pre-wrap;
      }
      #problems:empty { display: none; }
      #problems .err { color: var(--danger); }
      #problems .warn { color: var(--warn); }
      #problems .ok { color: var(--ok); }
      body.playing #problems { display: none; }
      #toast {
        position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
        background: #1c2130; border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 80%;
      }
      #toast.show { opacity: 1; }
      #toast.err { border-color: var(--danger); color: var(--danger); }
      #toast.ok { border-color: var(--ok); color: var(--ok); }
      #log {
        position: absolute; right: 10px; bottom: 10px; width: 380px; max-height: 40%; overflow-y: auto; margin: 0;
        padding: 8px 10px; border-radius: 8px; background: rgba(10, 12, 18, .92); font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap;
      }
      #log:empty { display: none; }

      #right { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px; }
      #right h2 { margin: 0 0 10px; font-size: 15px; }
      #right h3 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
      #right h3:empty { margin: 10px 0 0; border-top: 1px solid var(--line); }
      .row { display: grid; grid-template-columns: 104px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
      .row > span { color: var(--dim); }
      .row > div { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-width: 0; }
      .row input:not([type]), .row input[type=number], .row select {
        flex: 1; min-width: 0; width: 60px; background: #0e1118; border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
      }
      .row input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; }
      .row input:focus, .row select:focus { outline: none; border-color: var(--accent); }
      .chips { gap: 4px; }
      .chip { padding: 1px 8px; border-radius: 10px; opacity: .5; }
      .chip.on { opacity: 1; border-color: var(--accent); }
      .hint { color: var(--dim); font-size: 12px; margin: 6px 0; }

      .menu {
        position: absolute; z-index: 10; min-width: 200px; max-height: 60vh; overflow-y: auto; padding: 4px; border-radius: 8px;
        background: #171b26; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
      }
      .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; }
      .menu button:hover { background: #222838; }
      .menu h4 { margin: 6px 8px 2px; font-size: 11px; color: var(--dim); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="top"></div>
    <div id="left"></div>
    <div id="center">
      <canvas id="stage"></canvas>
      <iframe id="play" title="Chạy thử"></iframe>
      <div id="problems"></div>
      <pre id="log"></pre>
      <div id="toast"></div>
    </div>
    <div id="right"></div>
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
